<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="pet.css" />
  <title>Clawd</title>
</head>
<body>
  <section id="chat" class="hot hidden">
    <header id="chatHeader">
      <span id="chatTitle">Clawd</span>
      <span class="spacer"></span>
      <button id="btnNew" title="New conversation">↺</button>
      <button id="btnClose" title="Close">×</button>
    </header>
    <div id="transcript"></div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Ask Clawd to do something…"></textarea>
      <button type="button" id="btnStop" class="hidden" title="Stop">■</button>
      <button type="submit" id="btnSend" title="Send">➤</button>
    </form>
  </section>

  <div id="stage">
    <canvas id="pet" class="hot" width="200" height="190"></canvas>
    <div id="pill" class="hot hidden">
      <div id="pillTitle"></div>
      <div id="pillSub"></div>
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
